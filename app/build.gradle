plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.marketplacebatch'
    compileSdk 35

    // Keep Java and Kotlin JVM bytecode targets aligned and broadly compatible with CI.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'com.marketplacebatch'
        minSdk 26
        targetSdk 35
        versionCode 1000
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
}
